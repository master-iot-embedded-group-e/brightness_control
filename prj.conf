CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_EVENTS=y

CONFIG_LOG=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_POLL=y

CONFIG_PM=y
CONFIG_PM_POLICY_DEFAULT=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_RESET=y

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n
CONFIG_PM_DEVICE_RUNTIME=y

# Control runs in main. Keep it above the sensors thread (7), as the old
# control thread was, instead of the default main priority 0.
CONFIG_MAIN_THREAD_PRIORITY=6
